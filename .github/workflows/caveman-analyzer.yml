name: Build analyzer binaries
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    defaults:
      run:
        working-directory: packages/workflow/dsh-caveman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: packages/workflow/dsh-caveman/vendor/caveman/go.mod
          cache-dependency-path: packages/workflow/dsh-caveman/vendor/caveman/go.sum
      - name: Install verified Zig compiler
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "ZIG=$RUNNER_TEMP/zig/zig" >> "$GITHUB_ENV"
      - name: Build analyzer
        shell: bash
        run: |
          mkdir -p build
          os='${{ matrix.os }}'
          if [[ "$os" == windows ]]; then os=win32; fi
          file="dsh-caveman-learn_${os}_${{ matrix.arch }}"
          node scripts/build-learn-binary.mjs '${{ matrix.os }}' '${{ matrix.arch }}' "build/$file"
          echo "ARTIFACT=$file" >> "$GITHUB_ENV"
      - name: Test real Linux analyzer
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: |
          npm ci --no-audit --no-fund
          npm run build
          DSH_CAVEMAN_LEARN_BINARY="$PWD/build/$ARTIFACT" node --test tests/learn.integration.test.mjs tests/learn-binary.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analyzer-${{ matrix.os }}-${{ matrix.arch }}
          path: packages/workflow/dsh-caveman/build/${{ env.ARTIFACT }}
          if-no-files-found: error
          retention-days: 7
      - name: Collect analyzer licenses
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          assets="$PWD/build/licenses"
          mkdir -p "$assets"
          cp LICENSE LICENSE-MIT NOTICE "$assets/"
          cd vendor/caveman
          cp engine/pixel/NOTICE "$assets/NOTICE.engine-pixel"
          cp engine/pixel/assets/{SPLEEN_LICENSE,UNIFONT_LICENSE}.txt "$assets/"
          zig_dir="$(dirname "$ZIG")"
          cp "$zig_dir/LICENSE" "$assets/LICENSE.zig"
          cp "$zig_dir/lib/libc/musl/COPYRIGHT" "$assets/COPYRIGHT.musl"
          cp "$zig_dir/lib/libc/mingw/COPYING" "$assets/COPYING.mingw-w64"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/google/go-licenses/v2@v2.0.1
          bundle="$RUNNER_TEMP/third-party-go"
          mkdir -p "$bundle/go.dev/go"
          cp "$(go env GOROOT)/LICENSE" "$bundle/go.dev/go/LICENSE"
          for goos in linux darwin windows; do
            for goarch in amd64 arm64; do
              staging="$RUNNER_TEMP/go-licenses-$goos-$goarch"
              CGO_ENABLED=1 GOOS="$goos" GOARCH="$goarch" "$RUNNER_TEMP/bin/go-licenses" \
                save ./proxy/cmd/caveman-proxy --ignore github.com/JuliusBrussee/caveman --save_path "$staging"
              cp -Rf "$staging/." "$bundle/"
            done
          done
          tar -C "$bundle" --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - . \
            | gzip -n > "$assets/THIRD_PARTY_GO_LICENSES.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        with:
          name: analyzer-licenses
          path: packages/workflow/dsh-caveman/build/licenses/
          if-no-files-found: error
          retention-days: 7
