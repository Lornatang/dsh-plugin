name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.package }} / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/access/dsh-frontgate
          - packages/integrations/dsh-atlassian
          - packages/integrations/dsh-github
          - packages/integrations/dsh-notion
          - packages/security/dsh-codex-security
          - packages/security/dsh-security-audit
          - packages/workflow/dsh-caveman
        node: ['22.19.0', '24']
        os: [ubuntu-24.04]
        include:
          - { package: packages/access/dsh-frontgate, os: windows-latest, node: '22.19.0' }
          - { package: packages/access/dsh-frontgate, os: windows-latest, node: '24' }
          - { package: packages/integrations/dsh-atlassian, os: windows-2025, node: '24' }
          - { package: packages/security/dsh-codex-security, os: windows-2025, node: '24' }
          - { package: packages/security/dsh-codex-security, os: macos-26, node: '24' }
          - { package: packages/security/dsh-codex-security, os: macos-15-intel, node: '24' }
          - { package: packages/security/dsh-security-audit, os: windows-latest, node: '22.19.0' }
          - { package: packages/security/dsh-security-audit, os: windows-latest, node: '24' }
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci --no-audit --no-fund ${{ endsWith(matrix.package, '/dsh-security-audit') && '--ignore-scripts' || '' }}
      - run: npm run typecheck
      - run: npm test
      - run: git diff --exit-code -- lib
      - if: endsWith(matrix.package, '/dsh-frontgate')
        run: npm run pack:verify
      - if: >-
          startsWith(matrix.package, 'packages/integrations/') ||
          endsWith(matrix.package, '/dsh-security-audit') ||
          (endsWith(matrix.package, '/dsh-frontgate') && runner.os == 'Linux')
        run: npm audit --audit-level=high
